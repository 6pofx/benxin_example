# ============================================================================
# 死循环护栏：这张图**故意**是一张跑不完的图
# ----------------------------------------------------------------------------
#   spin(branch) ⇄ again(set)     —— 一个 token 都不烧，却能把 CPU 跑满
#
# 它是"三道防线"里第二条的靶子，必须与 budget-probe.yml 对照着看：
#   * budget-probe.yml 的环里有 agent 节点 ⇒ 消耗步数预算 ⇒ 步数预算拦得住；
#   * 这张图的两个节点都不调模型     ⇒ 步数预算**一步都不会增加**，
#     把它跑一万年也等不到 truncated。唯一的闸门是 maxVisitsPerNode。
#
# 这份定义刻意**不注册进 application.yml 的 llm.workflows.\***：
# 它一旦被注册，任何一次误调用都会在启动好的应用里抛异常，示例的其余部分就没法演示了。
# 需要它时用 WorkflowIo.read(...) 读进来，或者用 "逐次传入定义" 那条路径喂给 agent。
# ============================================================================
name: deadloop
description: 故意跑不完的图：用来证明只有 maxVisitsPerNode 能拦住"不调模型的死循环"

# 显式调小，免得演示要等 100 圈。默认值是 100（WorkflowDefinition.DEFAULT_MAX_VISITS）
maxVisitsPerNode: 5

nodes:
  - id: spin
    type: branch

  - id: again
    type: set
    set:
      rounds: "${rounds:-0}"

edges:
  - from: spin
    to: again
  - from: again
    to: spin
